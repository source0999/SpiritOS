services:
  scout-api:
    build: .
    container_name: scout_v0_1
    restart: unless-stopped
    env_file: .env
    environment:
      - SCOUT_SYNTHESIS_BATCH_SIZE=3
    ports:
      - "${SCOUT_API_PORT:-8077}:8077"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8077/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["cpu"]

  scout-api-nvidia:
    build: .
    container_name: scout_v0_1_nvidia
    restart: unless-stopped
    env_file: .env
    environment:
      - SCOUT_SYNTHESIS_BATCH_SIZE=3
    ports:
      - "${SCOUT_API_PORT:-8077}:8077"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8077/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["nvidia"]

  scout-api-amd:
    build: .
    container_name: scout_v0_1_amd
    restart: unless-stopped
    env_file: .env
    environment:
      - SCOUT_SYNTHESIS_BATCH_SIZE=3
    ports:
      - "${SCOUT_API_PORT:-8077}:8077"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8077/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    profiles: ["amd"]
