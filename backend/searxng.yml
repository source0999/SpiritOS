use_default_settings: true

general:
  instance_name: "SpiritOS Local Search"

search:
  formats:
    - html
    - json
  safe_search: 1

engines:
  # Plan 3 research stability: these engines returned CAPTCHA, rate-limit, or
  # access-denied metadata during the A3 provider probe while google/startpage
  # returned usable sources.
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: karmasearch
    disabled: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "replace-this-local-dev-secret"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
